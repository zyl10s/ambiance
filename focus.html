<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambiance focus shield</title><style>html,body{height:100%;margin:0;background:#101018;color:#e9e4db;font-family:system-ui,sans-serif}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}h1{font-size:clamp(35px,5vw,80px);font-weight:400;margin:0}p{color:#a6a1b4}button{border:1px solid #827e9c;background:transparent;color:#e9e4db;border-radius:9px;padding:14px 25px;cursor:pointer}</style></head><body><main><p>AMBIANCE · FOCUS MODE</p><h1>Stay in your flow.</h1><p>This display is resting while you study.</p><button id="close">Uncover this screen</button></main><script type="module">import {invoke} from '@tauri-apps/api/core';document.getElementById('close').addEventListener('click',()=>invoke('close_focus_shield'));document.addEventListener('keydown',e=>{if(e.key==='Escape')invoke('close_focus_shield')});</script></body></html>
