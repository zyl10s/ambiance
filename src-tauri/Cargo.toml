[package]
name = "ambiance"
version = "0.1.0"
description = "A themed ambient sound mixer"
authors = ["Ambiance contributors"]
edition = "2021"

[lib]
name = "ambiance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
